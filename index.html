<!doctype html>
<html lang="en">
  <head>
    <!-- Character Set for proper encoding -->
    <meta charset="UTF-8" />
  
    <!-- Favicon (.ico is more common for this) -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    
    <!-- Viewport settings for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <!-- SEO Meta Tags -->
    <meta name="description" content="Sreekanth Polireddy - Lead Software Engineer specializing in scalable applications and high-performing engineering teams. View portfolio, projects, and expertise." />
    <meta name="keywords" content="software engineer, lead developer, portfolio, web development, full stack, engineering, cloud computing, AI, machine learning" />
  
    <!-- Title of the page -->
    <title>Sreekanth Polireddy | Lead Software Engineer | Cloud Engineer | AI Specialist</title>
  
    <!-- Open Graph Meta Tags (for social media sharing) -->
    <meta property="og:title" content="Sreekanth Polireddy | Lead Software Engineer | Cloud Engineer | AI Specialist" />
    <meta property="og:description" content="Portfolio showcasing software engineering expertise, projects, and professional experience." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-portfolio-url.com" />  <!-- Replace with your actual URL -->
    <meta property="og:image" content="https://your-portfolio-url.com/images/og-image.jpg" />  <!-- Replace with actual image -->
  
    <!-- Twitter Card Meta Tags (for Twitter sharing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@yourTwitterHandle" />  <!-- Replace with your Twitter handle -->
    <meta name="twitter:title" content="Sreekanth Polireddy | Lead Software Engineer | Cloud Engineer | AI Specialist" />
    <meta name="twitter:description" content="Portfolio showcasing software engineering expertise, projects, and professional experience." />
    <meta name="twitter:image" content="https://your-portfolio-url.com/images/twitter-image.jpg" />  <!-- Replace with actual image -->
  
    <!-- Structured Data (JSON-LD for SEO improvement) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sreekanth Polireddy",
        "jobTitle": "Lead Software Engineer",
        "url": "https://your-portfolio-url.com",  <!-- Replace with your URL -->
        "sameAs": [
          "https://twitter.com/yourTwitterHandle",  <!-- Replace with your Twitter -->
          "https://www.linkedin.com/in/yourLinkedInProfile"  <!-- Replace with your LinkedIn -->
        ],
        "image": "https://your-portfolio-url.com/images/profile-image.jpg",  <!-- Replace with actual image -->
        "description": "Lead Software Engineer specializing in scalable applications and high-performing engineering teams."
      }
    </script>
  
    <!-- Preload important resources (e.g., fonts, critical styles) -->
    <link rel="preload" href="/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  
    <!-- Link to external CSS file (if you have one) -->
    <link rel="stylesheet" href="/styles/global.css" />
  
    <!-- Google Fonts (example, if you want to use a custom font) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Apple Touch Icon for iOS home screen (if desired) -->
    <link rel="apple-touch-icon" href="/images/apple-icon.png" />
  
    <!-- Additional Meta Tags for mobile experience -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
  </head>
  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
